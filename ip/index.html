<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Here it is</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    #out { margin-top: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Here it is</h1>
  <div id="out">Loading…</div>
  <p><small>Approximate location from your internet connection, so it can be a nearby town. Nothing is saved.</small></p>
  <script>
    fetch("https://ipapi.co/json/")
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(d => {
        const line = [d.city, d.region, d.postal, d.country_name].filter(Boolean).join(", ");
        document.getElementById("out").textContent = line || "Couldn't work it out.";
      })
      .catch(() => { document.getElementById("out").textContent = "Couldn't work it out."; });
  </script>
</body>
</html>
